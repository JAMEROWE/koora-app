name: Build Koora APK

# Builds the app automatically and gives you a ready-to-install APK file.
# Runs on: every push to main + manual runs (the "Run workflow" button).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allows publishing the APK to the Releases page

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Optional: add your football-data.org key as a repo Secret named
      # FOOTBALL_DATA_TOKEN to get real matches inside the built APK.
      # Without the secret the APK runs in demo mode.
      - name: Apply API key secret (if present)
        env:
          TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "FOOTBALL_DATA_TOKEN=$TOKEN" > local.properties
            echo "API key applied: REAL data mode"
          else
            echo "No token secret set -> DEMO data mode"
          fi

      - name: Restore stable signing keystore (from encrypted secret)
        env:
          KEY: ${{ secrets.KOORA_KEYSTORE }}
        run: |
          mkdir -p keystore
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > keystore/koora-release.keystore
            echo "Keystore restored — every build keeps the SAME signature"
          else
            echo "WARNING: KOORA_KEYSTORE secret missing -> unsigned APK"
          fi

      - name: Internal launch test (Robolectric boots the app headlessly)
        run: |
          if ./gradlew testDebugUnitTest --no-daemon --stacktrace; then
            echo "LAUNCH TEST PASSED"
          else
            echo "=== STARTUP CRASH DETECTED — the app would not open on a phone ==="
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              grep -o 'message="[^"]*"' "$f" | head -5 || true
            done
            exit 1
          fi

      - name: Build signed release APK (up to 3 attempts)
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if ./gradlew assembleRelease --no-daemon --stacktrace; then
              echo "BUILD_OK"
              exit 0
            fi
            echo "Attempt $i failed (often a temporary download issue). Retrying in 30s..."
            sleep 30
          done
          echo "All 3 build attempts failed."
          exit 1

      - name: Upload APK (download it from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Koora-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Every build publishes/refreshes the APK on the public Releases page:
      # https://github.com/JAMEROWE/koora-app/releases — a stable link that
      # always serves the newest built version, no login needed.
      - name: Publish APK to the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d '"' -f2)
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "Koora-v$VERSION.apk"
          gh release create "$TAG" "Koora-v$VERSION.apk" \
            --title "Koora $TAG" \
            --notes "Download Koora-$VERSION.apk below and open it on your phone to install or update." \
          || gh release upload "$TAG" "Koora-v$VERSION.apk" --clobber
          rm -f "Koora-v$VERSION.apk"
